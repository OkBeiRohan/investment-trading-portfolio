
[package]
authors = ["Trading System Team"]
edition = "2024"
name = "compute_engine"
version = "1.0.0"
description = "High-performance feature computation engine for algorithmic trading"

[lib]
crate-type = ["cdylib", "rlib"] # cdylib for NAPI, rlib for tests

[dependencies]
napi = "3.0.0"
napi-derive = "3.0.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
ndarray = "0.17"
statrs = "0.18"
ts-rs = "11.1"
serde_json = "1.0.149"
rayon = "1.8"
once_cell = "1.19"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
opt-level = 3
codegen-units = 1
