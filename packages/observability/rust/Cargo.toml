[package]
name = "observability"
version = "0.1.0"
edition = "2024"

[dependencies]
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = "0.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.23"
tokio = { version = "1", features = ["full"] }