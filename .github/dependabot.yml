# Dependabot Configuration for Investment Trading Portfolio
# Consolidates updates per ecosystem into single PRs using `directories` + `groups`.
# Result: ~5 PRs max (npm, pip, cargo, docker, github-actions) instead of 20+.

version: 2
updates:
  # ── npm (all apps, packages, services) ─────────────────────────────
  # Single entry covering every package.json in the monorepo.
  # The catch-all group batches all updates into ONE pull request.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/algo-worker"
      - "/apps/api"
      - "/apps/web"
      - "/packages/auth-client"
      - "/packages/authentication"
      - "/packages/database"
      - "/packages/eslint-config"
      - "/packages/jest-config"
      - "/packages/market-sdk"
      - "/packages/observability"
      - "/packages/schema"
      - "/packages/trpc"
      - "/packages/typescript-config"
      - "/services/data-processor"
      - "/services/document-processor"
      - "/services/market-feeder"
      - "/services/notification-service"
      - "/services/wealth-analyzer"
      - "/services/wealth-management"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Catch-all: every npm dependency goes into one PR
      all-npm:
        patterns:
          - "*"

  # ── Python (training-pipeline + observability) ─────────────────────
  - package-ecosystem: "pip"
    directories:
      - "/services/training-pipeline"
      - "/packages/observability/python"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps-py)"
      include: "scope"
    groups:
      all-python:
        patterns:
          - "*"

  # ── Rust / Cargo (compute-engine + observability) ──────────────────
  - package-ecosystem: "cargo"
    directories:
      - "/packages/compute-engine"
      - "/packages/observability/rust"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "05:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps-rust)"
    groups:
      all-rust:
        patterns:
          - "*"

  # ── Docker ─────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/infrastructure/docker"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps-docker)"
    groups:
      all-docker:
        patterns:
          - "*"

  # ── GitHub Actions ─────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps-ci)"
    groups:
      all-actions:
        patterns:
          - "*"
