# Dependabot Configuration for Investment Trading Portfolio
# Consolidates version updates across all supported ecosystems into one PR.

version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "automated"
      - "consolidated"

updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/algo-worker"
      - "/apps/api"
      - "/apps/web"
      - "/packages/auth-client"
      - "/packages/authentication"
      - "/packages/database"
      - "/packages/eslint-config"
      - "/packages/jest-config"
      - "/packages/market-sdk"
      - "/packages/observability"
      - "/packages/schema"
      - "/packages/trpc"
      - "/packages/typescript-config"
      - "/services/data-processor"
      - "/services/document-processor"
      - "/services/market-feeder"
      - "/services/notification-service"
      - "/services/wealth-analyzer"
      - "/services/wealth-management"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "pip"
    directories:
      - "/packages/observability/python"
      - "/services/training-pipeline"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    commit-message:
      prefix: "chore(deps-py)"
      include: "scope"

  - package-ecosystem: "cargo"
    directories:
      - "/packages/compute-engine"
      - "/packages/observability/rust"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    commit-message:
      prefix: "chore(deps-rust)"

  - package-ecosystem: "docker"
    directory: "/infrastructure/docker"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    commit-message:
      prefix: "chore(deps-docker)"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    commit-message:
      prefix: "chore(deps-ci)"
