receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 1000
    spike_limit_mib: 200

  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: insert

exporters:
  # Metrics -> Prometheus
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "trading_system"

  # Logs -> Loki
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"

  # Traces -> Tempo
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  # Sentry (Self-hosted)
  # Note: For production, replace 'host.docker.internal' with the actual Sentry IP/Hostname
  otlphttp/sentry:
    endpoint: "http://host.docker.internal:9000/api/1/envelope/"
    compression: gzip
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo] # Add otlphttp/sentry here if you want traces in Sentry

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [loki]
