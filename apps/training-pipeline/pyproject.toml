[tool.poetry]
name = "training-pipeline"
version = "0.1.0"
description = "ML Training Pipeline for Algo Trading"

[tool.poetry.dependencies]
python = "^3.11"
kedro = "^1.1.1"
pandas = "^2.1.0"
numpy = "^2.3.5"
scikit-learn = "^1.4.0"

# Deep Learning
torch = "^2.5.0"
torchvision = "^0.20.0"
lightning = "^2.4.0"

# ML Libraries
xgboost = "^3.1.2"
lightgbm = "^4.5.0"
catboost = "^1.2.0"

# RL
stable-baselines3 = "^2.3.0"
gymnasium = "^1.0.0"

# Time-Series
statsmodels = "^0.14.0"
arch = "^8.0.0"  # For GARCH

# Technical Analysis
ta = "^0.11.0"
ta-lib = "^0.6.8"

# ONNX
onnx = "^1.16.0"
onnxruntime-gpu = "^1.19.0"
skl2onnx = "^1.17.0"

# Experiment Tracking
mlflow = "^3.7.0"
optuna = "^4.1.0"

# Database
psycopg2-binary = "^2.9.0"
sqlalchemy = "^2.0.0"

# Visualization
matplotlib = "^3.9.0"
seaborn = "^0.13.0"
plotly = "^6.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"