# XGBoost Hyperparameters

# Model Architecture
max_depth: 6
learning_rate: 0.03
n_estimators: 500
subsample: 0.8
colsample_bytree: 0.8
min_child_weight: 3
gamma: 0.1

# Regularization
reg_alpha: 0.1 # L1 regularization
reg_lambda: 1.0 # L2 regularization

# Training
early_stopping_rounds: 50
eval_metric: ['auc', 'logloss']
objective: 'binary:logistic'

# System
n_jobs: -1
random_state: 42
verbose: 1

# Cross-Validation
cv_folds: 5
cv_shuffle: false # Maintain temporal order

# Classification
threshold: 0.55

# Feature Engineering
feature_groups:
  underlying:
    - realizedVol5d
    - realizedVol10d
    - realizedVol20d
    - rsi14
    - macd
    - macdSignal
    - macdHistogram
    - sma20
    - sma50
    - ema12
    - ema26

  sentiment:
    - indiaVix
    - indiaVixMA5
    - pcrVolume
    - pcrOI
    - maxPain

  options:
    - atmIV
    - volSkew
    - termStructure
    - callIVSpread
    - putIVSpread

  time:
    - hour
    - dayOfWeek
    - isMarketOpen
