# Stacking Ensemble Configuration

# Level-0 Base Models
base_models:
  xgboost:
    enabled: true
    model_path: 'models/xgboost_model.onnx'
    weight: 0.25

  cnn_lstm:
    enabled: true
    model_path: 'models/cnn_lstm_model.onnx'
    weight: 0.25

  ginn:
    enabled: true
    model_path: 'models/ginn_model.onnx'
    weight: 0.25

  svm:
    enabled: true
    model_path: 'models/svm_model.onnx'
    weight: 0.25

# Level-1 Meta-Model
meta_model:
  type: 'logistic_regression' # 'logistic_regression', 'xgboost', 'neural_network'

  # Logistic Regression Settings
  logistic_regression:
    penalty: 'l2'
    C: 1.0
    solver: 'lbfgs'
    max_iter: 1000
    class_weight: 'balanced'

  # Alternative: XGBoost Meta-Learner
  xgboost_meta:
    max_depth: 3
    learning_rate: 0.1
    n_estimators: 100
    subsample: 0.8

  # Alternative: Neural Network Meta-Learner
  neural_network:
    layers:
      - units: 8
        activation: 'relu'
        dropout: 0.2
      - units: 4
        activation: 'relu'
    output:
      units: 1
      activation: 'sigmoid'

# Training
training:
  # Use out-of-fold predictions to avoid leakage
  cv_folds: 5
  shuffle: false # Maintain temporal order

  # For neural network meta-model
  epochs: 50
  batch_size: 32
  validation_split: 0.2

# Stacking Strategy
stacking:
  # Use probabilities or class predictions from L0 models
  use_probabilities: true

  # Include original features in meta-model
  include_original_features: false

  # Blending method if not using meta-model
  blending_method: 'weighted_average' # 'simple_average', 'weighted_average', 'voting'

# Classification
threshold: 0.55

# System
random_state: 42
verbose: 1
# Expected Performance
# Target Sharpe Ratio: > 1.5
# Target Sortino Ratio: > 2.0
# Max Drawdown: < 20%
