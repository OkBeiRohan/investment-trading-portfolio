# CNN-LSTM Hybrid Configuration

# Architecture
model:
  name: 'cnn_lstm_hybrid'
  type: 'sequential'

  # Input
  sequence_length: 60 # Number of timesteps
  n_features: 25 # Number of features per timestep

  # CNN Layers
  cnn:
    filters: 64
    kernel_size: 3
    activation: 'relu'
    padding: 'same'
    pool_size: 2

  # LSTM Layers
  lstm:
    units: 50
    return_sequences: false
    dropout: 0.2
    recurrent_dropout: 0.2

  # Dense Layers
  dense:
    - units: 32
      activation: 'relu'
      dropout: 0.3
    - units: 16
      activation: 'relu'
      dropout: 0.2

  # Output Layer
  output:
    units: 1
    activation: 'sigmoid'

# Training
training:
  batch_size: 32
  epochs: 100
  validation_split: 0.15
  shuffle: false # Maintain temporal order

  # Optimizer
  optimizer:
    type: 'adam'
    learning_rate: 0.001
    beta_1: 0.9
    beta_2: 0.999
    epsilon: 1e-07

  # Loss
  loss: 'binary_crossentropy'

  # Metrics
  metrics: ['accuracy', 'AUC', 'precision', 'recall']

  # Callbacks
  callbacks:
    early_stopping:
      monitor: 'val_loss'
      patience: 15
      restore_best_weights: true
      min_delta: 0.0001

    reduce_lr:
      monitor: 'val_loss'
      factor: 0.5
      patience: 5
      min_lr: 1e-6
      verbose: 1

    model_checkpoint:
      monitor: 'val_auc'
      save_best_only: true
      mode: 'max'

# Data Processing
data:
  normalize: true
  normalization_method: 'standard' # 'standard' or 'minmax'
  balance_classes: true
  balance_method: 'oversample' # 'undersample' or 'oversample'

# Classification
threshold: 0.55

# System
random_state: 42
gpu_memory_growth: true
mixed_precision: false
