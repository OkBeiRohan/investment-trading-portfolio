# Training Pipeline Parameters
# Updated with batch training configuration

training:
  training_start: "2023-01-01"
  training_end: "2026-12-31"
  batch_days: 30 # Load 30 days at a time to reduce RAM usage
  test_split: 0.2

validation:
  validation_start: "2025-01-01"
  validation_end: "2026-12-31"
  batch_days: 30

features:
  feature_columns:
    # Index Breadth (6)
    - pct_stocks_above_vwap
    - pct_stocks_above_ema20
    - weighted_return_top10
    - advance_decline_ratio
    - breadth_momentum_5m
    - breadth_volatility
    # NIFTY FUTURE (9)
    - fut_price_vs_vwap
    - fut_range_position
    - fut_return_1m
    - fut_return_5m
    - fut_atr_percent
    - fut_volume_zscore
    - fut_oi_change
    - fut_rsi_14
    - fut_macd
    # Options (11)
    - atm_iv
    - atm_iv_change
    - iv_skew
    - gamma_atm
    - vega_atm
    - theta_atm
    - pcr_oi
    - pcr_volume
    - max_pain_distance
    - charm_atm
    - vanna_atm
    # Volatility (4)
    - india_vix
    - realized_vol_5m
    - realized_vol_15m
    - vol_expansion_ratio
    # Time (3)
    - minutes_from_open
    - minutes_to_close
    - day_of_week

  target_column: "target_direction" # Binary: 1=VOL_UP, 0=VOL_DOWN

lightgbm:
  objective: "binary"
  metric: "auc"
  boosting_type: "gbdt"
  num_leaves: 31
  learning_rate: 0.01
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 5
  max_depth: 6
  min_data_in_leaf: 20
  num_boost_round: 500
  early_stopping_rounds: 20
  verbose: -1

xgboost:
  objective: "binary:logistic"
  eval_metric: "auc"
  max_depth: 6
  learning_rate: 0.01
  n_estimators: 500
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  early_stopping_rounds: 20

tier0:
  target: "actualGapPct"
  features:
    - "giftNiftyPremium"
    - "sp500OvernightReturn"
    - "nasdaqOvernightReturn"
    - "nikkeiReturn"
    - "ftseReturn"
    - "brentCrudeChange"
    - "wtiCrudeChange"
    - "goldChange"
    - "usdInrChange"
    - "us10yYieldChange"
  xgboost:
    objective: "reg:squarederror"
    eval_metric: "rmse"
    max_depth: 4
    learning_rate: 0.05
    n_estimators: 200

tier1:
  features:
    - "return1d"
    - "rangeHl"
    - "macd"
    - "rsi14"
    - "realizedVol20d"
    - "indiaVix"
    - "sma50"
    - "sma200"
  hmm:
    n_components: 4
    covariance_type: "full"
    n_iter: 200
  patchtst:
    sequence_length: 60
    patch_length: 5
    epochs: 10
    batch_size: 64
    learning_rate: 0.001
    forecast_horizon: 5

tier2:
  dataset_name: "nse_index_nifty_50_cpcv_25folds"
  instrument_key: "NSE_INDEX|Nifty 50"
  lightgbm:
    objective: "binary"
    metric: "auc"
    boosting_type: "gbdt"
    num_leaves: 31
    learning_rate: 0.01
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    max_depth: 6
    min_data_in_leaf: 20
    num_boost_round: 500
    early_stopping_rounds: 30
    verbose: -1

tier3:
  features:
    - "bidAskSpreadBps"
    - "depthImbalance5"
    - "ofi1s"
    - "ofi5s"
    - "tradeImbalance"
  lit:
    sequence_length: 20
    epochs: 5
    batch_size: 256
    learning_rate: 0.005
    forecast_horizon: 1

meta:
  epochs: 20
  batch_size: 128
  learning_rate: 0.001
  num_regimes: 4
  volatile_regime_idx: 3

evaluation:
  initial_capital: 100000  # Example: 1 Lakh INR
  fees: 0.0004            # 4 bps (Upstox estimate + taxes/STT)
  slippage: 0.0001        # 1 bps slippage expectation
  prob_threshold: 0.65    # Required ML confidence to enter a trade

# Model export
export:
  output_dir: "data/06_models"
  onnx_opset: 13
  quantization: "fp16" # FP16 for 2x faster inference
