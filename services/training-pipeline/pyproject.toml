[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "training_pipeline"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "scikit-learn>=1.5.1,<1.8.0",
    "psycopg2-binary>=2.9.11",
    "pymongo>=4.6.0",
    "lightgbm>=4.6.0",
    "xgboost>=2.1.3",
    "python-dotenv>=1.0.1",
    "hmmlearn>=0.3.2",
    "torch>=2.4.0",
    "shap>=0.43.0",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.0.0",
    "scipy>=1.11.0",
    "vectorbt>=0.24.5",
    "empyrical-reloaded>=0.5.7",
    "transformers>=4.40.0",
    "setuptools; python_version >= '3.12'",
    "mlflow>=3.10.1",
    "optuna>=4.0.0",
    "boto3>=1.35.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-instrumentation-logging>=0.50b0",
    "matplotlib>=3.9.0",
    "coloredlogs>=15.0.0",
]

[project.scripts]
"training-pipeline" = "training_pipeline.runner:main"

[project.optional-dependencies]
docs = [
    "docutils<0.23",
    "sphinx>=5.3,<8.2",
    "sphinx_rtd_theme==3.1.0",
    "nbsphinx==0.9.8",
    "sphinx-autodoc-typehints==3.0.1",
    "sphinx_copybutton==0.5.2",
    "ipykernel>=5.3, <8.0",
    "Jinja2<3.2.0",
    "myst-parser>=1.0,<4.1"
]
dev = [
    "pytest-cov>=3,<8",
    "pytest-mock>=1.7.1, <4.0",
    "pytest>=7.2,<10.0",
    "ruff>=0.12,<0.16"
]

[tool.setuptools.dynamic]
version = {attr = "training_pipeline.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
addopts = """
--cov-report term-missing \
--cov src/training_pipeline -ra"""

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.lint]
select = [
    "F",   # Pyflakes
    "W",   # pycodestyle
    "E",   # pycodestyle
    "I",   # isort
    "UP",  # pyupgrade
    "PL",  # Pylint
    "T201", # Print Statement
]
ignore = ["E501"]  # Ruff format takes care of line-too-long

