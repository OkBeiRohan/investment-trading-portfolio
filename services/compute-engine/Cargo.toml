[package]
name = "compute-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# NAPI-RS for Node.js bindings
napi = "2.16"
napi-derive = "2.16"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Numerical computations
ndarray = "0.16"
statrs = "0.17"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Observability
observability = { path = "../../packages/observability/rust" }
tokio = { version = "1.36", features = ["full"] }

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
