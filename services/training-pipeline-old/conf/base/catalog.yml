# =============================================================================
# Training Pipeline Data Catalog (Updated for compute-engine architecture)
# =============================================================================
#
# ARCHITECTURE CHANGE:
# - Feature engineering now done by compute-engine (Rust/NAPI)
# - Features pre-computed and stored in QuestDB by market-feeder
# - Training pipeline only LOADS features from QuestDB (no computation)
#
# =============================================================================

# =============================================================================
# QuestDB Data Sources (Pre-computed Features from compute-engine)
# =============================================================================

# LightGBM features (33 features from Market State Encoder)
# Computed by: compute-engine → market-feeder → QuestDB
# Loaded by: train_ensemble/nodes.py::load_training_data()
lightgbm_features:
  type: pandas.SQLQueryDataset
  sql: >
    SELECT * FROM lightgbm_features
    WHERE symbol = 'NIFTY'
      AND timestamp >= '{start_date}'
      AND timestamp < '{end_date}'
    ORDER BY timestamp ASC
  credentials: questdb
  layer: raw

# =============================================================================
# Training Outputs (Models & Predictions)
# =============================================================================

# Trained LightGBM model
lightgbm_model:
  type: pickle.PickleDataset
  filepath: data/06_models/lightgbm.txt
  layer: models

# Out-of-fold predictions (for meta-learner)
oof_lightgbm:
  type: pandas.ParquetDataset
  filepath: data/07_model_output/oof_lightgbm.parquet
  layer: model_output

# XGBoost model (PLACEHOLDER)
xgboost_model:
  type: pickle.PickleDataset
  filepath: data/06_models/xgboost.pkl
  layer: models

# CNN-LSTM model (PLACEHOLDER)
cnn_lstm_model:
  type: pickle.PickleDataset
  filepath: data/06_models/cnn_lstm.pkl
  layer: models

# GINN model (PLACEHOLDER)
ginn_model:
  type: pickle.PickleDataset
  filepath: data/06_models/ginn.pkl
  layer: models

# SVM model (PLACEHOLDER)
svm_model:
  type: pickle.PickleDataset
  filepath: data/06_models/svm.pkl
  layer: models

# Transformer model (PLACEHOLDER)
transformer_model:
  type: pickle.PickleDataset
  filepath: data/06_models/transformer.pkl
  layer: models

# Meta-learner (stacking) - TIER 3
meta_learner_model:
  type: pickle.PickleDataset
  filepath: data/06_models/meta_learner.pkl
  layer: models

# =============================================================================
# ONNX Exports (for algo-worker production)
# =============================================================================

lightgbm_onnx:
  type: onnxruntime.ONNXDataset
  filepath: onnx/lightgbm.onnx

xgboost_onnx:
  type: onnxruntime.ONNXDataset
  filepath: onnx/xgboost.onnx
