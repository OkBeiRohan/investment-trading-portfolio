# =============================================================================
# Training Pipeline Parameters (Updated for compute-engine architecture)
# =============================================================================

# =============================================================================
# Data Loading
# =============================================================================

questdb_connection: "postgresql://admin:quest@localhost:8812/qdb"
training_period_days: 730 # 2 years of historical data
symbol: "NIFTY"

# =============================================================================
# Walk-Forward Validation
# =============================================================================

training_config:
  n_splits: 12 # 12-fold walk-forward validation
  purge_window: 375 # 1 day (375 minutes = 9:15 AM - 3:30 PM)
  embargo_window: 375 # 1 day embargo after test
  random_state: 42

# =============================================================================
# Volatility-Adjusted Labeling
# =============================================================================

labeling_config:
  horizon: 5 # 5-minute forward return
  k: 1.0 # ATR multiplier for threshold
  atr_column: "fut_atr_percent" # Use NIFTY FUTURE ATR

# =============================================================================
# LightGBM Hyperparameters (Production-Grade)
# =============================================================================

lightgbm_config:
  objective: "multiclass"
  num_class: 3 # UP, NEUTRAL, DOWN
  metric: "multi_logloss"
  boosting_type: "gbdt"
  num_leaves: 31 # Conservative (prevents overfitting)
  learning_rate: 0.05 # Slow learning
  n_estimators: 400 # With early stopping
  min_data_in_leaf: 80 # High minimum (prevents overfitting)
  feature_fraction: 0.8 # Column sampling
  bagging_fraction: 0.8 # Row sampling
  bagging_freq: 5 # Bagging frequency
  lambda_l1: 0.5 # L1 regularization
  lambda_l2: 1.0 # L2 regularization
  max_depth: -1 # No depth limit (controlled by num_leaves)
  verbose: -1 # Silent
  device: "gpu" # Use RTX GPU
  gpu_platform_id: 0
  gpu_device_id: 0

# =============================================================================
# XGBoost Hyperparameters (PLACEHOLDER)
# =============================================================================

xgboost_config:
xgboost:
  max_depth: 8
  learning_rate: 0.01
  n_estimators: 500
  subsample: 0.8
  colsample_bytree: 0.8
  objective: "binary:logistic"
  eval_metric: "logloss"
  early_stopping_rounds: 50

# CNN-LSTM
cnn_lstm:
  conv_filters: [64, 128]
  kernel_size: 3
  lstm_units: 50
  dense_units: 32
  dropout: 0.3
  learning_rate: 0.001
  batch_size: 64
  epochs: 100

# GINN (GARCH-Informed Neural Network)
ginn:
  garch_p: 1
  garch_q: 1
  lstm_units: 64
  learning_rate: 0.0005
  batch_size: 32
  epochs: 80

# SVM
svm:
  kernel: "rbf"
  C: [0.1, 1, 10] # Grid search
  gamma: ["scale", "auto"]
  class_weight: "balanced"

# Transformer
transformer:
  num_layers: 4
  d_model: 256
  num_heads: 8
  d_ff: 1024
  dropout: 0.1
  learning_rate: 0.0001
  batch_size: 32
  epochs: 100

# LightGBM
lightgbm:
  num_leaves: 31
  learning_rate: 0.05
  n_estimators: 500
  max_depth: -1
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8

# Meta-Learner (Logistic Regression Stacker)
meta_learner:
  solver: "lbfgs"
  max_iter: 1000
  C: 1.0

# RL Agent (TD3)
rl_agent:
  algorithm: "TD3" # or "SAC"
  actor_lr: 0.001
  critic_lr: 0.001
  gamma: 0.99
  tau: 0.005
  policy_noise: 0.2
  noise_clip: 0.5
  policy_delay: 2
  buffer_size: 1000000
  batch_size: 256
  warmup_steps: 10000
  total_timesteps: 1000000

# ONNX Export
onnx_export:
  opset_version: 17
  optimize: true
  verify: true
  dynamic_batch: true
